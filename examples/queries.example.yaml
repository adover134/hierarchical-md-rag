# 질의셋 형식. 각 항목:
#   query: 검색해볼 실제 질문
#   expected_contains: 정답 청크에 반드시 들어있어야 할 문자열(들). 하나면 문자열, 여러 개면 리스트
#     — 리스트면 "그 중 하나라도" 포함되면 정답으로 인정한다.
#
# 판정을 "정답 chunk_id"가 아니라 "부분 문자열 포함"으로 하는 이유는 hierarchical_md_rag/eval.py
# 상단 docstring 참고 — 청킹 전략마다 청크 경계 자체가 달라서 청크 ID로는 공정 비교가 안 된다.
#
# 아래는 형식을 보여주는 예시일 뿐이며 실제 문서 내용과는 무관하다. 자신의 markdown 문서 내용에
# 맞게 새로 작성해서 쓸 것.
queries:
  - query: "입찰 참가 자격은 무엇인가요?"
    expected_contains: "입찰참가자격"
  - query: "낙찰자는 어떻게 결정되나요?"
    expected_contains:
      - "낙찰자 결정"
      - "낙찰자를 결정"
  - query: "제출 서류에는 어떤 것들이 있나요?"
    expected_contains: "제출서류"
