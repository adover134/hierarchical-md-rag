# 3개 시스템 비교 실험 설정 — `python scripts/run_experiment.py ...`가 읽는다 (사용법: EXPERIMENTS.md).
#
# 공정성 규칙: 문서·엑셀·평가셋·top_k·LLM(gpt-oss:20b)·Judge를 모두 동일하게 쓰고, DB만 각 시스템이 자기
# 방식으로 만든다. 경로는 이 파일이 있는 저장소 루트 기준(절대 경로도 가능).

# --- 입력 데이터 ---------------------------------------------------------------
corpus_dir: RAG_프로세스_테스트_데이터_원본          # 문서 57건(hwp/hwpx/pdf) + 엑셀. 저장소에 커밋하지 않는다.
bid_list_xlsx: RAG_프로세스_테스트_데이터_원본/입찰공고목록_20260808_20260809.xlsx
work_dir: experiments/work                         # 사전 변환한 PDF 등 중간 산출물(gitignore)
runs_dir: eval_resources/experiment_runs           # 실행 결과 JSON(gitignore, 요약만 EXPERIMENTS.md에 기록)

# --- LLM: 세 시스템 + Judge + 파서 모두 로컬 Ollama gpt-oss:20b -------------------------
llm:
  base_url: http://localhost:11434/v1
  api_key: ollama-local
  model: gpt-oss:20b          # 답변·질의의도·파서(Pass1b) 모델
  judge_model: gpt-oss:20b
  timeout_sec: 1200

top_k: 5                      # 세 시스템 모두 동일(팀 프로젝트 기본값은 10 — 평가에서는 5로 통일)
repeat: 1                     # 같은 문항 반복 횟수. temperature=0.0이어도 비결정적이라 2~3으로 올려 편차를 볼 수 있다.

# --- 평가셋: 저장소에 있는 기존 파일을 수정 없이 그대로 사용 ---------------------------------
datasets:
  - {name: new20,    path: eval_resources/eval_dataset_new20.yaml,    role: existing,       enabled: true}   # m1~m20 (기존 20문항)
  - {name: new20_v2, path: eval_resources/eval_dataset_new20_v2.yaml, role: generalization, enabled: true}   # n1~n20 (팀 프로젝트 당시 쓰지 않은 신규 20문항)
  - {name: new8,     path: eval_resources/eval_dataset_new8.yaml,     role: extra,          enabled: false}
  - {name: docs57,   path: eval_resources/eval_dataset_57docs.yaml,   role: extra,          enabled: false}

# --- 태그: 평가셋을 고치지 않고 여기서 데이터셋+id로 지정 ------------------------------------
tags:
  # 과거에 틀렸다가 고친 문항(docs/BUGFIXES.md). 통과 = Correctness >= regression_pass_score
  regression_pass_score: 4
  regression:
    new20: [m2, m17, m19, m20]
  # 수치 비교 질의: 기대 값이 모두 답에 있고, winner가 비교 문장의 주어로 언급돼야 통과(LLM 미사용).
  # values/winner는 해당 문항의 expected_answer에서 확인한 값으로 채운다(EXPERIMENTS.md 참고).
  numeric_compare: {}

table_samples: experiments/table_samples.yaml      # 표 정합률 샘플(정답 `라벨: 값` 쌍)

# --- 시스템 ---------------------------------------------------------------------------
# kind: team    = 팀 프로젝트 최종 RAG(별도 체크아웃, 코드 무수정). 문서는 PDF로 변환해 팀 전처리기에 넣는다.
# kind: current = 이 저장소. HWP/HWPX는 새 파서(hwp2md), PDF는 팀 원본 PDF 경로로 색인한다.
# db_from: 다른 시스템의 DB를 그대로 쓴다(답변 전략만 다름).
systems:
  - name: team_final
    title: 팀 프로젝트 최종 RAG
    kind: team
    project_root: ../RAG_project
    env: {}
  - name: current_default
    title: 현 버전 기본(two_stage)
    kind: current
    project_root: .
    env: {HWP_RAG_ANSWER_STRATEGY: two_stage}
  - name: current_multi_agent
    title: 현 버전 멀티에이전트
    kind: current
    project_root: .
    db_from: current_default
    env: {HWP_RAG_ANSWER_STRATEGY: multi_agent}
