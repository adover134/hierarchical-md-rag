# eval_dataset_new20.yaml(m1~m20)이 multi_agent 브랜치 디버깅 과정에서 반복 튜닝의
# 대상이 됐으므로, 그 결과가 이 특정 20문항에 과적합된 게 아닌지 확인하기 위해 완전히
# 새로 작성한 20문항 평가셋. eval_dataset_new20.yaml/new8.yaml/57docs.yaml/
# variance_probe.yaml 네 파일이 이미 쓴 문서는 하나도 겹치지 않게, 코퍼스(57개 문서) 중
# 이 세션에서 처음 다루는 20개 문서에서 문항을 뽑았다.
# 모든 expected_answer와 chunk_uids는 data_index/chroma_B에 색인된 실제 청크 원문에서
# 직접 확인한 값이다(vector_store.collection.get(include=["metadatas","documents"])로 검증).
# query_type: single_doc(한 문서 안에서 답변) / multi_doc(여러 문서 종합 비교)

