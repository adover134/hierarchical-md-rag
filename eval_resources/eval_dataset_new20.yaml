# 팀 프로젝트(AI_7-team)가 원래 20문항 규모로 평가했던 것에 맞춰, hierarchical-md-rag
# 코퍼스(57개 문서)에서 완전히 새로 작성한 20문항 평가셋. eval_dataset_new8.yaml(n1~n8),
# eval_dataset_57docs.yaml(q1~q8)과 겹치는 문서를 의도적으로 하나도 쓰지 않았다 —
# 두 파일은 형식/난이도 참고용으로만 봤고, 문항/문서는 전부 새로 골랐다.
# 모든 expected_answer와 chunk_uids는 data_index/chroma_B에 색인된 실제 청크 원문에서
# 직접 확인한 값이다(vector_store.collection.get(where={"source": ...})로 검증).
# query_type: single_doc(한 문서 안에서 답변) / multi_doc(여러 문서 종합 비교)

